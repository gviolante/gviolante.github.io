<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Verificação de interface do portfólio</title>
<body>
<pre id="results">Executando verificações…</pre>
<iframe id="page" title="Página em teste" style="height:1000px;border:0"></iframe>
<script type="module">
const results = [];
const frame = document.querySelector('#page');
const assert = (condition, message) => { if (!condition) throw new Error(message); results.push(message); };
const delay = () => new Promise(resolve => setTimeout(resolve, 80));
const load = async (path, width) => {
  frame.style.width = `${width}px`;
  await new Promise((resolve, reject) => {
    frame.onload = resolve;
    frame.onerror = reject;
    frame.src = path;
  });
  await delay();
  return frame.contentDocument;
};
const initialPreference = localStorage.getItem('portfolio-theme');
try {
  const routes = ['/', '/projetos/', '/projetos/tinyflow-edgenids/', '/projetos/enem-runner/', '/404.html'];
  for (const theme of ['light', 'dark']) {
    localStorage.setItem('portfolio-theme', theme);
    for (const width of [320, 390, 768, 1440]) {
      for (const route of routes) {
        const doc = await load(route, width);
        assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 1, `Sem overflow: ${theme} ${route} em ${width}px${doc.documentElement.scrollWidth > doc.documentElement.clientWidth + 1 ? JSON.stringify([...doc.querySelectorAll("main *")].filter(el => el.getBoundingClientRect().right > width + 1).map(el => ({tag:el.tagName,cls:el.className,right:el.getBoundingClientRect().right})).slice(0,8)) : ""}`);
        assert(doc.documentElement.dataset.theme === theme, `Tema ${theme}: ${route}`);
        assert(doc.querySelectorAll('h1').length === 1, `Título principal: ${route} em ${width}px`);
        assert(doc.querySelector('main')?.textContent.trim().length > 100, `Conteúdo renderizado: ${route} em ${width}px`);
      }
    }
  }
  localStorage.removeItem('portfolio-theme');
  let doc = await load('/', 390);
  const menu = doc.querySelector('.menu-toggle');
  const nav = doc.querySelector('#site-nav');
  assert(frame.contentWindow.getComputedStyle(nav).display === 'none', 'Menu móvel inicia fechado');
  menu.click();
  assert(menu.getAttribute('aria-expanded') === 'true' && frame.contentWindow.getComputedStyle(nav).display === 'flex', 'Botão abre o menu móvel');
  doc.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  assert(menu.getAttribute('aria-expanded') === 'false' && doc.activeElement === menu, 'Escape fecha o menu e devolve o foco');
  menu.click();
  nav.querySelector('a[href="/#sobre"]').click();
  assert(menu.getAttribute('aria-expanded') === 'false', 'Navegar por âncora fecha o menu');
  assert(doc.querySelector('.contact-email').getAttribute('href') === 'mailto:gabriel.violant@gmail.com', 'Contato aponta para o e-mail público');

  doc = await load('/projetos/', 390);
  for (const [filter, count] of [['pesquisa', 1], ['jogos', 1], ['all', 2]]) {
    doc.querySelector(`[data-filter="${filter}"]`).click();
    assert(doc.querySelectorAll('.catalog-grid .project-card:not([hidden])').length === count, `Filtro ${filter}: ${count} projetos`);
    assert(doc.querySelectorAll('.filters [aria-pressed="true"]').length === 1, `Filtro ${filter}: seleção acessível única`);
    assert(doc.querySelector('#filter-count').textContent.startsWith(String(count)), `Filtro ${filter}: contagem anunciada`);
  }
  const chooseTheme = (value) => {
    const select = doc.querySelector('#theme-select');
    select.value = value;
    select.dispatchEvent(new frame.contentWindow.Event('change', { bubbles: true }));
  };
  chooseTheme('dark');
  assert(doc.documentElement.dataset.theme === 'dark', 'Seletor aplica tema escuro');
  assert(localStorage.getItem('portfolio-theme') === 'dark', 'Escolha escura é salva');
  doc = await load('/projetos/enem-runner/', 390);
  assert(doc.documentElement.dataset.theme === 'dark' && doc.querySelector('#theme-select').value === 'dark', 'Tema persiste entre páginas');
  doc = await load('/projetos/enem-runner/', 390);
  assert(doc.documentElement.dataset.theme === 'dark', 'Tema persiste após recarregar');
  assert(frame.contentWindow.getComputedStyle(doc.body).backgroundColor === 'rgb(20, 36, 29)', 'CSS aplica fundo escuro');
  chooseTheme('light');
  assert(doc.documentElement.dataset.theme === 'light', 'Seletor retorna ao tema claro');
  assert(frame.contentWindow.getComputedStyle(doc.body).backgroundColor === 'rgb(245, 244, 236)', 'CSS restaura paleta clara');
  chooseTheme('system');
  assert(localStorage.getItem('portfolio-theme') === null, 'Sistema remove preferência explícita');
  assert(doc.documentElement.dataset.theme === (frame.contentWindow.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), 'Modo sistema acompanha preferência do navegador');

  for (const url of ['/projetos/deteccao-de-abelhas/', '/assets/images/field-intelligence.svg', '/personalContext/HistoricoEscolar.pdf', '/ideas.md', '/CONTEXTO_PROJETO.md']) {
    assert((await fetch(url)).status === 404, `Recurso privado ou removido inacessível por HTTP: ${url}`);
  }
  document.body.dataset.state = 'passed';
  document.querySelector('#results').textContent = JSON.stringify({ status: 'passed', total: results.length, results }, null, 2);
} catch (error) {
  document.body.dataset.state = 'failed';
  document.querySelector('#results').textContent = JSON.stringify({ status: 'failed', error: error.message, completed: results }, null, 2);
} finally {
  if (initialPreference === null) localStorage.removeItem('portfolio-theme');
  else localStorage.setItem('portfolio-theme', initialPreference);
}
</script>
</body>
</html>
