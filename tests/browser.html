<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Verificação de interface do portfólio</title>
<body>
<pre id="results">Executando verificações…</pre>
<iframe id="page" title="Página em teste" style="height:1000px;border:0"></iframe>
<script type="module">
const results = [];
const frame = document.querySelector('#page');
const assert = (condition, message) => { if (!condition) throw new Error(message); results.push(message); document.querySelector('#results').textContent = JSON.stringify({ status: 'running', total: results.length, last: message }); };
const delay = () => new Promise(resolve => setTimeout(resolve, 80));
let navigationCount = 0;
const load = async (path, width) => {
  frame.style.width = `${width}px`;
  await new Promise((resolve, reject) => {
    frame.onload = resolve;
    frame.onerror = reject;
    const target = new URL(path, location.origin);
    target.searchParams.set('qa', ++navigationCount);
    frame.src = target.href;
  });
  await delay();
  return frame.contentDocument;
};
const initialPreference = localStorage.getItem('portfolio-theme');
try {
  const routes = ['/', '/pt/', '/projects/', '/projetos/', '/404.html', '/pt/404/'];
  for (const theme of ['light', 'dark']) {
    localStorage.setItem('portfolio-theme', theme);
    for (const width of [320, 390, 768, 1440]) {
      for (const route of routes) {
        const doc = await load(route, width);
        assert(doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 1, `Sem overflow: ${theme} ${route} em ${width}px${doc.documentElement.scrollWidth > doc.documentElement.clientWidth + 1 ? JSON.stringify([...doc.querySelectorAll("main *")].filter(el => el.getBoundingClientRect().right > width + 1).map(el => ({tag:el.tagName,cls:el.className,right:el.getBoundingClientRect().right})).slice(0,8)) : ""}`);
        assert(doc.documentElement.dataset.theme === theme, `Tema ${theme}: ${route}`);
        assert(doc.querySelectorAll('h1').length === 1, `Título principal: ${route} em ${width}px`);
        assert(Boolean(doc.querySelector('main h1')?.textContent.trim()) && Boolean(doc.querySelector('main p')?.textContent.trim()), `Conteúdo renderizado: ${route} em ${width}px`);
      }
    }
  }
  localStorage.removeItem('portfolio-theme');
  let doc = await load('/', 390);
  const menu = doc.querySelector('.menu-toggle');
  const nav = doc.querySelector('#site-nav');
  assert(frame.contentWindow.getComputedStyle(nav).display === 'none', 'Menu móvel inicia fechado');
  menu.click();
  assert(menu.getAttribute('aria-expanded') === 'true' && frame.contentWindow.getComputedStyle(nav).display === 'flex', 'Botão abre o menu móvel');
  doc.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  assert(menu.getAttribute('aria-expanded') === 'false' && doc.activeElement === menu, 'Escape fecha o menu e devolve o foco');
  menu.click();
  nav.querySelector('a[href="/#about"]').click();
  assert(menu.getAttribute('aria-expanded') === 'false', 'Navegar por âncora fecha o menu');
  assert(doc.querySelector('.contact-email').getAttribute('href') === 'mailto:gabriel.violant@gmail.com', 'Contato aponta para o e-mail público');

  doc = await load('/#papers', 390);
  assert(doc.querySelector('.language-switch').getAttribute('href').endsWith('/pt/#papers'), 'Troca de idioma preserva seção atual');
  doc = await load('/pt/#papers', 390);
  assert(doc.documentElement.lang === 'pt-BR', 'Português declara idioma correto');
  assert(doc.querySelector('.language-switch').getAttribute('href').endsWith('/#papers'), 'Retorno ao inglês preserva seção');
  assert(doc.querySelector('[data-theme-option="system"]').textContent.includes('Sistema'), 'Controle de tema traduzido');
  for (const route of ['/', '/pt/']) {
    doc = await load(route, 390);
    const resume = doc.querySelector('.hero-actions a[href^="https://drive.google.com/"]');
    assert(resume?.target === '_blank' && resume.pathname.endsWith('/view'), `Currículo abre visualizador em nova guia: ${route}`);
    const transcript = doc.querySelector('.academic-link a');
    assert(transcript?.target === '_blank' && transcript.href === 'https://drive.google.com/file/d/1YkdNL98nDzrrYCe3zcRNeONgaR9dzQGE/view?usp=sharing', `Histórico abre no Drive em nova guia: ${route}`);
    assert(!doc.querySelector('a[download], a[href*="article/download/"], a[href$=".pdf"]'), `Sem download direto: ${route}`);
    assert(doc.querySelectorAll('.project-card').length === 5, `Cinco projetos: ${route}`);
    assert(doc.querySelectorAll('.conference-logo img').length === 3, `Três logos de conferências: ${route}`);
    for (const link of doc.querySelectorAll('a[href^="https://"]')) {
      assert(link.target === '_blank' && link.rel.includes('noopener'), `Link externo em nova guia: ${link.href}`);
    }
    const images = [...doc.querySelectorAll('img')];
    await Promise.all(images.map(img => new Promise((resolve, reject) => {
      const probe = new Image();
      probe.onload = () => { assert(probe.naturalWidth > 0, `Imagem carregada: ${img.getAttribute('src')}`); resolve(); };
      probe.onerror = () => reject(new Error(`Imagem inválida: ${img.src}`));
      probe.src = img.src;
    })));
  }
  const chooseTheme = (value) => {
    doc.querySelector(`[data-theme-option="${value}"]`).click();
  };
  chooseTheme('dark');
  assert(doc.documentElement.dataset.theme === 'dark', 'Seletor aplica tema escuro');
  assert(localStorage.getItem('portfolio-theme') === 'dark', 'Escolha escura é salva');
  doc = await load('/projetos/', 390);
  assert(doc.documentElement.dataset.theme === 'dark' && doc.querySelector('[data-theme-option="dark"]').getAttribute('aria-pressed') === 'true', 'Tema persiste entre páginas');
  doc = await load('/projetos/', 390);
  assert(doc.documentElement.dataset.theme === 'dark', 'Tema persiste após recarregar');
  assert(frame.contentWindow.getComputedStyle(doc.body).backgroundColor === 'rgb(14, 11, 24)', 'CSS aplica fundo escuro');
  chooseTheme('light');
  assert(doc.documentElement.dataset.theme === 'light', 'Seletor retorna ao tema claro');
  assert(frame.contentWindow.getComputedStyle(doc.body).backgroundColor === 'rgb(246, 244, 251)', 'CSS restaura paleta clara');
  chooseTheme('system');
  assert(localStorage.getItem('portfolio-theme') === null, 'Sistema remove preferência explícita');
  assert(doc.documentElement.dataset.theme === (frame.contentWindow.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), 'Modo sistema acompanha preferência do navegador');

  for (const url of ['/projetos/deteccao-de-abelhas/', '/projects/tinyflow-edgenids/', '/projetos/enem-runner/', '/assets/documents/resume-en.pdf', '/assets/papers/tinyflow-edgenids.pdf', '/assets/images/field-intelligence.svg', '/personalContext/HistoricoEscolar.pdf', '/ideas.md', '/CONTEXTO_PROJETO.md']) {
    assert((await fetch(url)).status === 404, `Recurso privado ou removido inacessível por HTTP: ${url}`);
  }
  document.body.dataset.state = 'passed';
  document.querySelector('#results').textContent = JSON.stringify({ status: 'passed', total: results.length, results }, null, 2);
} catch (error) {
  document.body.dataset.state = 'failed';
  document.querySelector('#results').textContent = JSON.stringify({ status: 'failed', error: error.message, completed: results }, null, 2);
} finally {
  if (initialPreference === null) localStorage.removeItem('portfolio-theme');
  else localStorage.setItem('portfolio-theme', initialPreference);
}
</script>
</body>
</html>
